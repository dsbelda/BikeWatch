name: BikeWatch
options:
  bundleIdPrefix: com.dsbelda
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""  # tu Team ID de Apple
    CODE_SIGN_STYLE: Automatic
targets:
  BikePhone:
    type: application
    platform: iOS
    sources: [Sources/Phone, Sources/Shared, Sources/LiveShared]
    dependencies:
      - target: BikeLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsbelda.bikewatch
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BikeWatch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Conecta con el sensor de la bici estática.
        INFOPLIST_KEY_UIBackgroundModes: bluetooth-central audio
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: Lee tu pulso durante el entrenamiento.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Sincroniza el entrenamiento con el reloj.
    entitlements:
      path: BikePhone.entitlements
      properties:
        com.apple.developer.healthkit: true
  BikeLive:
    type: app-extension
    platform: iOS
    sources: [Sources/Live, Sources/LiveShared, Sources/Shared/Format.swift]
    info:
      path: Sources/Live/Info.plist
      properties:
        CFBundleDisplayName: BikeWatch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsbelda.bikewatch.live
        SWIFT_VERSION: "5.0"
  BikeWatch:
    type: application
    platform: watchOS
    sources: [Sources/Watch, Sources/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsbelda.bikewatch.watchkitapp
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.dsbelda.bikewatch
        INFOPLIST_KEY_CFBundleDisplayName: BikeWatch
        INFOPLIST_KEY_NSHealthShareUsageDescription: Lee tu pulso durante el entrenamiento.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Guarda el entrenamiento en Salud.
        INFOPLIST_KEY_WKBackgroundModes: workout-processing
    entitlements:
      path: BikeWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
schemes:
  BikePhone:
    build:
      targets:
        BikePhone: all
    run:
      config: Debug
  BikeWatch:
    build:
      targets:
        BikeWatch: all
    run:
      config: Debug
